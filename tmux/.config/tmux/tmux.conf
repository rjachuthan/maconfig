
# Tmux Configuration
# Generated with TmuxAI Config Generator
# https://tmuxai.dev

# -- Basic Settings ------------------------------------------
set -g prefix C-b
set -g escape-time 0
set -g history-limit 5000
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on

# -- Terminal & Graphics Support ----------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm*:Tc"
set -g allow-passthrough on
set -ga update-environment TERM_PROGRAM
# Kitty graphics protocol support
set -ga update-environment KITTY_WINDOW_ID
set -ga update-environment KITTY_PID
set -ga update-environment KITTY_PUBLIC_KEY

# -- Status Bar ---------------------------------------------
set -g status-position top
set -g status-interval 1

# -- Reload Config -----------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# -- Pane Navigation (vim-style) ---------------------------
# Primary: Ctrl+h/j/k/l (works seamlessly with Neovim via vim-tmux-navigator)
# Fallback: prefix + h/j/k/l (for when you want explicit tmux navigation)
unbind l  # Remove default 'last-window' binding

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# -- Session Picker (floating popup) ------------------------
# Ctrl+t opens tmux-sessionizer in a floating popup instead of typing
# into the current pane; picking a project switch-clients straight to it.
bind-key -n C-t display-popup -E -w 80% -h 80% -T " Sessions " "tmux-sessionizer"

# -- Pane Resizing -----------------------------------------
bind -r M-Left  resize-pane -L 5
bind -r M-Right resize-pane -R 5
bind -r M-Up    resize-pane -U 5
bind -r M-Down  resize-pane -D 5

# -- Plugins -----------------------------------------------
# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Other plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Copy Mode Enhancements
set -g @plugin 'tmux-plugins/tmux-yank'       # Copy to system clipboard
set -g @plugin 'tmux-plugins/tmux-copycat'    # Regex search & quick copy

# Yank settings
set -g @yank_action 'copy-pipe-no-clear'      # Stay in copy mode after yank
set -g @yank_selection 'primary'              # Use primary clipboard
set -g @yank_selection_mouse 'clipboard'      # Mouse selection uses clipboard

# Copycat settings (searches available in copy mode)
# prefix + / - regex search
# prefix + ctrl-f - file search
# prefix + ctrl-g - git status files
# prefix + alt-h - SHA-1/SHA-256 hashes
# prefix + ctrl-u - URLs
# prefix + ctrl-d - digits (great for ports, PIDs)

# Session Management - Resurrect & Continuum
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'  # Save pane contents
set -g @resurrect-strategy-nvim 'session'     # Restore nvim sessions

# Continuum settings
set -g @continuum-restore 'on'                # Auto-restore on tmux start
set -g @continuum-save-interval '15'          # Auto-save every 15 minutes
set -g @continuum-boot 'on'                   # Start tmux on boot (macOS)
set -g @continuum-boot-options 'kitty'        # Use kitty terminal

# Initialize TMUX plugin manager
# Keep this line at the very bottom of tmux.conf
run '~/.tmux/plugins/tpm/tpm'

# -- Status Bar (after TPM so tmux-sensible doesn't override) --
set -g status-left "#{session_name} "
set -g status-left-length 50
set -g status-right "#[fg=black,bg=green,bold] #(git -C #{pane_current_path} rev-parse --abbrev-ref HEAD 2>/dev/null || echo 'no git') #[fg=green,bg=default,nobold]  #{host} "
set -g status-right-length 100

# -- Theme (after TPM to override any plugin defaults) -----
set -g status-style "bg=default,fg=green"
set -g status-left-style "bg=default,fg=green"
set -g status-right-style "bg=default,fg=green"
set -g pane-border-style "fg=colour237"
set -g pane-active-border-style "fg=green"
set -g message-style "bg=default,fg=green"
setw -g window-status-style "bg=default"
setw -g window-status-current-style "bg=default"
setw -g window-status-format "#[fg=colour28,bg=default] #I #W "
setw -g window-status-current-format "#[fg=black,bg=green,bold] #I #W "
