# AeroSpace Configuration
# https://nikitabobko.github.io/AeroSpace

config-version = 2

# Startup commands
after-startup-command = [
  'exec-and-forget sketchybar',
  'exec-and-forget borders',
  'exec-and-forget skhd',
]

# Notify Sketchybar about workspace changes
exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

# Start at login
start-at-login = true

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Accordion padding
accordion-padding = 30

# Layout defaults
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Mouse follows focus on monitor change
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Don't auto-unhide apps
automatically-unhide-macos-hidden-apps = false

# Persistent workspaces
persistent-workspaces = ["1", "2", "3", "4", "5"]

# Binding mode change callback
on-mode-changed = []

[key-mapping]
preset = 'qwerty'

# Gaps configuration
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.bottom = 10
outer.top = [
  { monitor.'dell' = 60 },
  { monitor.'built-in retina display' = 20 },
  20,
]
outer.right = 10

# Main binding mode
[mode.main.binding]

# Layout switching
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Focus movement (vim-style)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Window movement
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Workspace switching
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-w = 'workspace W'
alt-t = 'workspace T'
alt-b = 'workspace B'
alt-c = 'workspace C'
alt-v = 'workspace V'
alt-g = 'workspace G'

# Move window to workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-w = 'move-node-to-workspace w'
alt-shift-t = 'move-node-to-workspace t'
alt-shift-b = 'move-node-to-workspace b'
alt-shift-c = 'move-node-to-workspace c'
alt-shift-v = 'move-node-to-workspace v'
alt-shift-g = 'move-node-to-workspace g'

# Workspace navigation
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Service mode
alt-shift-semicolon = 'mode service'

# Open terminal (Ghostty)
alt-enter = '''exec-and-forget open -n -a ghostty'''

# Service binding mode
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
s = ['layout tiling', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# Automatic workspace assignment
[[on-window-detected]]
if.app-id = "net.whatsapp.WhatsApp"
run = ["move-node-to-workspace W"]

# Using Ghostty instead of WezTerm solely for the quick terminal feature
[[on-window-detected]]
if.app-id = "com.mitchellh.ghostty"
run = ["move-node-to-workspace T"]

[[on-window-detected]]
if.app-id = "app.zen-browser.zen"
run = ["move-node-to-workspace B"]

[[on-window-detected]]
if.app-id = "com.todesktop.230313mzl4w4u92"
run = ["move-node-to-workspace C"]

[[on-window-detected]]
if.app-id = "com.microsoft.VSCode"
run = ["move-node-to-workspace V"]

[[on-window-detected]]
if.app-id = "com.google.Chrome"
run = ["move-node-to-workspace G"]

[[on-window-detected]]
if.app-id = 'com.apple.finder'
check-further-callbacks = true
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'mpv'
run = ['layout floating', 'exec-and-forget ~/.config/aerospace/center-window.sh mpv']
