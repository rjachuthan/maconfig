font_family      0xProto
font_size 16.0
adjust_line_height 120%

disable_ligatures never

# 0xProto's Nerd Font patched build has broken ligature lookups, so we use
# the unpatched font for text and pull Nerd Font icon glyphs from the
# patched variant only for the ranges they occupy.
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD,U+100000-U+10FFFD 0xProto Nerd Font Mono
symbol_map U+2500-U+259F 0xProto Nerd Font Mono

background_opacity 1
background_blur 40
dynamic_background_opacity yes

# Window margins
# Add margins (blank area outside the border) on all 4 sides
window_margin_width 10

# Keep margins even when only a single window is visible
single_window_margin_width 10 30 10 30

# Hide macOS title bar (window management handled by Aerospace)
hide_window_decorations titlebar-and-corners
